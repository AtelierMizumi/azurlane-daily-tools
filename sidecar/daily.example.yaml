# Cấu hình daily orchestrator. Sao chép thành daily.yaml rồi chỉnh lại.

device:
  profile: waydroid                 # Chỉ hỗ trợ "waydroid" (phone chưa có)
  serial: 192.0.2.10:5555      # Địa chỉ ADB của thiết bị Waydroid (ip:port)
  resolution: 1280x720              # Độ phân giải màn hình, dạng WxH

alas:
  container_name: alas              # Tên container Docker đang chạy ALAS
  webui_url: http://127.0.0.1:22267 # URL WebUI của ALAS
  repo_dir: ../AzurLaneAutoScript   # Thư mục repo ALAS (đường dẫn tương đối theo file config này)

timeouts:
  run_minutes: 60                   # Thời gian chạy tối đa mỗi lượt (phút), mặc định 60 nếu bỏ trống

notify:
  ntfy_url: null                    # URL topic ntfy để nhận thông báo; đặt null để tắt thông báo

daemon:
  listen: 127.0.0.1:22268           # Web dashboard (22268 = cạnh ALAS WebUI 22267); đổi host ngoài localhost thì BẮT BUỘC đặt token
  token: null                       # token bảo vệ API khi mở ra LAN
  always_on: true                   # giữ container ALAS chạy trong lúc daemon chạy (ALAS tự lập lịch)
  run_at: null                      # chỉ dùng khi always_on=false: giờ spawn pipeline mỗi ngày, dạng "HH:MM"
  watchdog: true                    # watchdog checks chạy trong daemon (đừng chạy watchdog.py riêng nữa)
  watchdog_interval: 60             # giây giữa các vòng kiểm tra watchdog
